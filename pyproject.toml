[project]
name = "felt-research"
version = "0.1.0"
description = "Reproducible experiments in audio-conditioned, beat-aligned haptics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "torch>=2.6,<3", "matplotlib>=3.9,<4"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felt"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "RUF100", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
